<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rune - Bijou</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111;
}

/* NAV */
nav {
  padding: 20px;
  font-weight: bold;
}

/* PRODUIT */
.container {
  display: flex;
  flex-wrap: wrap;
  padding: 50px;
  gap: 50px;
  justify-content: center;
}

.image {
  flex: 1;
  min-width: 300px;
}

.image img {
  width: 100%;
  border-radius: 10px;
}

.info {
  flex: 1;
  min-width: 300px;
}

h1 {
  font-size: 40px;
}

.prix {
  font-size: 25px;
  margin: 20px 0;
}

button {
  background: black;
  color: white;
  border: none;
  padding: 15px 25px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #444;
}

.back {
  margin: 20px;
  display: inline-block;
  cursor: pointer;
}
</style>
</head>

<body>

<nav class="back" onclick="history.back()">← Retour</nav>

<div class="container">

  <div class="image">
    <img src="rendu2.jpg">
  </div>

  <div class="info">
    <h1>Rune</h1>
    <p class="prix">110€</p>
    <p>
      Bijou fait main avec amour, inspiré de la nature et des symboles anciens.
      Chaque pièce est unique.
    </p>

    <button onclick="commander()">Commander</button>
  </div>

</div>

<script>
function commander() {
  window.location.href = "mailto:prune-berger@orange.fr?subject=Commande Rune&body=Bonjour, je souhaite commander le bijou Rune";
}
</script>

</body>
</html>
