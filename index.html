<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mes Bijoux</title>

<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: #ffffff;
  color: #222;
}

header {
  text-align: center;
  padding: 40px 20px;
}

header h1 {
  font-size: 32px;
  letter-spacing: 2px;
}

header p {
  color: #777;
}

.produits {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.produit {
  width: 250px;
  margin: 20px;
  text-align: center;
}

.produit img {
  width: 100%;
  border-radius: 10px;
}

.produit h2 {
  font-size: 18px;
  margin: 10px 0;
}

.prix {
  color: #bfa046;
  font-weight: bold;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  border: none;
  background: black;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

button:hover {
  background: #444;
}

footer {
  text-align: center;
  padding: 30px;
  color: #aaa;
  font-size: 14px;
}
</style>

</head>

<body>

<header>
  <h1>✨ Mes Bijoux ✨</h1>
  <p>Bijoux faits main avec amour</p>
</header>

<section class="produits">

  <div class="produit">
    <img src="https://via.placeholder.com/300">
    <h2>Collier doré</h2>
    <p class="prix">20€</p>
    <button onclick="commander()">Commander</button>
  </div>

  <div class="produit">
    <img src="https://via.placeholder.com/300">
    <h2>Bague élégante</h2>
    <p class="prix">15€</p>
    <button onclick="commander()">Commander</button>
  </div>

</section>

<footer>
  © 2026 - Mes Bijoux
</footer>

<script>
function commander() {
  window.location.href = "prune-berger@orange.fr";
}
</script>

</body>
</html>
