<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rune</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
  color: #111;
}

/* RETOUR */

.back {
  padding: 20px;
  font-weight: bold;
  cursor: pointer;
}

/* PRODUIT */

.container {
  display: flex;
  flex-wrap: wrap;
  gap: 50px;
  padding: 50px;
  justify-content: center;
}

.images {
  flex: 1;
  min-width: 300px;
}

.main-image img {
  width: 100%;
  height: 500px;
  object-fit: cover;
  border-radius: 12px;
}

/* MINIATURES */

.thumbnails {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.thumbnails img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.thumbnails img:hover {
  opacity: 0.7;
}

.info {
  flex: 1;
  min-width: 300px;
}

h1 {
  font-size: 45px;
}

.prix {
  font-size: 28px;
  color: #0000ff;
  font-weight: bold;
  margin: 20px 0;
}

button {
  background: #0000ff;
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: black;
}

</style>
</head>

<body>

<div class="back" onclick="history.back()">
← Retour
</div>

<div class="container">

<!-- IMAGES -->

<div class="images">

<div class="main-image">
<img id="product-image" src="rendu2.jpg">
</div>

<div class="thumbnails">

<img src="rendu2.jpg"
onclick="changeImage(this.src)">

<img src="IMG_94512.JPG"
onclick="changeImage(this.src)">

<img src="IMG_6699.png"
onclick="changeImage(this.src)">

</div>

</div>

<!-- INFOS -->

<div class="info">

<h1>Rune</h1>

<p class="prix">110€</p>

<p>
Bijou fait main inspiré des symboles anciens,
de la lune et de l’élégance naturelle.
Chaque pièce est unique.
</p>

<button onclick="commander()">
Commander
</button>

</div>

</div>

<script>

function changeImage(image) {

document.getElementById("product-image").src = image;

}

function commander() {

window.location.href =
"mailto:prune-berger@orange.fr?subject=Commande Rune";

}

</script>

</body>
</html>
